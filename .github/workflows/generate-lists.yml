name: Generate MikroTik Lists

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Generate lists
        run: |
          mkdir -p mikrotik
          
          python scripts/generate_lists__iplist_json.py --service "lostfilm.tv" --type ip4 --out "mikrotik/list_lostfilm.rsc"
      
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mikrotik/
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update lists $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          else
            echo "No changes to commit"
          fi
